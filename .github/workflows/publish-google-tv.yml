name: Publish CatFlix Google TV APK

on:
  push:
    branches: [main]
    paths:
      - 'versions.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add the signed TV APK
        env:
          APK_ARCHIVE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-bcf0-820e-828e-d4fdb422500a/raw?se=2026-11-21T03%3A37%3A01Z&sp=r&sv=2026-06-06&sr=b&scid=9980975f-2ca7-4fee-b162-ca02de068ff2&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-20T12%3A41%3A43Z&ske=2026-11-21T12%3A41%3A43Z&sks=b&skv=2026-06-06&sig=FwoyKmM6EfeiQwL1h4FCTJvUdgOq4ajLDxAkaOKXpcc%3D"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$APK_ARCHIVE_URL" -o /tmp/catflix-tv.zip
          unzip -p /tmp/catflix-tv.zip app-googleTv-release.apk > CatFlix-Google-TV-0.13.5.apk
          echo "7098a53205c9807e6ad14297c7b36ed91d3b35d277d5180d245dff3df5fd2110  CatFlix-Google-TV-0.13.5.apk" | sha256sum --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CatFlix-Google-TV-0.13.5.apk
          git commit -m "Publish CatFlix Google TV 0.13.5"
          git push
